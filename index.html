<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 พระเครื่องแดนสยาม - แกลเลอรีผู้ใช้</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
  พระเครื่องแดนสยาม
</header>

<div id="app">
  <div id="top-controls">
    <select id="categorySelect"></select>
    <input type="text" id="searchBox" placeholder="🔍 ค้นหารูป...">
  </div>

  <div id="gallery"></div>

  <!-- Album View Modal -->
  <div id="albumModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalAlbumTitle">อัลบั้ม</h3>
        <button class="modal-close" onclick="closeAlbumModal()">&times;</button>
      </div>
      <div id="albumModalContent"></div>
    </div>
  </div>
</div>

<footer>
  <p>💾 เก็บข้อมูลถาวรในเครื่อง | ผู้ใช้ทั่วไปสามารถดูรูปภาพได้เท่านั้น</p>
</footer>

<script src="scripts/app_user.js" defer></script>
</body>
</html>
