<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸 พระเครื่องแดนสยาม - แกลเลอรีผู้ใช้</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>พระเครื่องแดนสยาม</header>

<div id="app">
  <!-- Tab Controls -->
  <div id="top-controls">
    <button id="tabGallery" class="tab-btn active">Gallery รูป</button>
    <button id="tabAlbums" class="tab-btn">อัลบั้ม</button>
    <select id="categorySelect"></select>
    <input type="text" id="searchBox" placeholder="🔍 ค้นหา...">
  </div>

  <div id="gallery"></div>

  <!-- Album View Modal -->
  <div id="albumModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalAlbumTitle">อัลบั้ม</h3>
        <button class="modal-close" onclick="closeAlbumModal()">&times;</button>
      </div>
      <div id="albumModalContent"></div>
    </div>
  </div>

  <!-- Image View Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalImageTitle">รูปภาพ</h3>
        <button class="modal-close" onclick="closeImageModal()">&times;</button>
      </div>
      <div id="imageModalContent" style="text-align: center;"></div>
    </div>
  </div>
</div>

<footer>
  <p>BPT AI โค้ดและไอเดียอุ๋ยบางแค</p>
</footer>

<script src="scripts/app_user.js" defer></script>
</body>
</html>
